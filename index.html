  .lockup{width:200px; margin:0 auto; display:block}
  h1{font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(26px,4vw,38px); margin:36px 0 14px; letter-spacing:-.01em}
  p.lede{font-size:16px; color:var(--silver); line-height:1.6; margin:0 auto 30px; max-width:46ch}
  .contact{display:flex; gap:28px; justify-content:center; flex-wrap:wrap; font-family:'Archivo',sans-serif; font-size:13px; letter-spacing:.06em}
  .contact a{color:var(--white); text-decoration:none; border-bottom:1px solid rgba(255,255,255,.35); padding-bottom:2px}
  .contact a:hover{border-color:var(--white)}
  @media(prefers-reduced-motion: reduce){ .diamonds div{animation:none} }
  @media(max-width:560px){ .diamonds div{width:280px;height:280px} .contact{flex-direction:column; gap:14px} }
